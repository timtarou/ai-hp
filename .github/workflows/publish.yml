name: Publish to npm

# Publishes with npm trusted publishing (OIDC): no npm token is stored anywhere, and npm attaches
# a provenance attestation that links the package to this workflow run and commit.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: The release tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # The first version was published by hand (npm needs a package to exist before a trusted publisher
      # can be set up), so a release for a version that is already on npm is skipped instead of failing.
      - name: Skip if this version is already on npm
        id: check
        run: |
          if npm view "ai-hp@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::ai-hp@${GITHUB_REF_NAME#v} is already on npm; nothing to publish"
          fi
      - if: steps.check.outputs.skip != 'true'
        run: npm ci
      - if: steps.check.outputs.skip != 'true'
        run: npm publish
